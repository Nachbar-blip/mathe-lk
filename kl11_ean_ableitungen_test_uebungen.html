<!--
  Uebungssammlung Kl. 11 EAN zum Test Ableitungen: Ableitungsregeln (inkl. negative Exponenten, Variablen-Gemeinheiten),
  Differenzen-/Differentialquotient, Tangenten. Single-File, keine externen Abhaengigkeiten, offline lauffaehig.
  Formeln als HTML/CSS (Bruchsatz per inline-flex). Aufgaben im JS-Datenarray, Rendering per innerHTML.
  Alle Ergebnisse mit sympy verifiziert; Funktionsterme bewusst verschieden von Test und Klausur.
-->
<style>
  :root{
    --bg:#fbfbf9; --fg:#1d1f23; --muted:#5a5f68; --line:#e3e2dd;
    --accent:#2d6a9f; --okbg:#eaf6ef; --tipbg:#fff8ec;
    --g:#2e7d5a; --a:#2d6a9f; --v:#b06a2e; --radius:10px; --maxw:900px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:var(--maxw);margin:0 auto;padding:22px 16px 72px}
  h1{font-size:1.5rem;margin:.2em 0 .4em}
  h2{font-size:1.15rem;margin:1.5em 0 .3em;scroll-margin-top:64px;display:flex;align-items:center;gap:.5em}
  h2 .dot{width:.7em;height:.7em;border-radius:50%;background:var(--accent);display:inline-block}
  p{margin:.4em 0}
  .zurueck{display:inline-block;color:var(--accent);text-decoration:none;font-size:.9rem}
  .bar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.5em;padding:.5em 0;margin-bottom:.4em;z-index:5;flex-wrap:wrap}
  .filter{display:flex;gap:.3em;flex-wrap:wrap}
  .fbtn{font:inherit;font-size:.9rem;padding:.3em .8em;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--fg);cursor:pointer}
  .fbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{font:inherit;font-size:.9rem;padding:.35em .8em;border:0;border-radius:7px;background:#eef2f6;color:var(--accent);cursor:pointer}
  .aufgabe{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:.7em .9em;margin:.6em 0}
  .aufgabe.hidden{display:none}
  .a-head{display:flex;align-items:center;gap:.5em;cursor:pointer;user-select:none}
  .a-num{font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--muted)}
  .a-badge{font-size:.72rem;font-weight:600;padding:.1em .55em;border-radius:6px}
  .b-g{background:#eef6f0;color:var(--g)} .b-a{background:#eef2f8;color:var(--a)} .b-v{background:#f7efe6;color:var(--v)}
  .a-caret{margin-left:auto;color:var(--muted);transition:transform .2s}
  .aufgabe.collapsed .a-caret{transform:rotate(-90deg)}
  .aufgabe.collapsed .a-body{display:none}
  .a-body{margin-top:.3em}
  ol.tl{list-style:none;counter-reset:tl;margin:.3em 0 .3em .2em;padding:0}
  ol.tl li{counter-increment:tl;margin:.35em 0;padding-left:1.7em;text-indent:-1.7em}
  ol.tl li *{text-indent:0}
  ol.tl li::before{content:counter(tl,lower-alpha) ")";display:inline-block;width:1.7em;text-indent:0}
  details{margin-top:.45em;border-top:1px dashed var(--line);padding-top:.35em}
  details>summary{cursor:pointer;font-size:.94rem;font-weight:600;list-style:none}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:"\25B8  ";color:var(--muted)}
  details[open]>summary::before{content:"\25BE  "}
  details.tipp>summary{color:var(--v)}
  details.loes>summary{color:var(--g)}
  .tipp .body{background:var(--tipbg);border:1px solid #f0dfc0;border-radius:8px;padding:.45em .8em;margin-top:.35em}
  .loes .body{background:var(--okbg);border:1px solid #cfe7d7;border-radius:8px;padding:.45em .8em;margin-top:.35em}
  /* Formelsatz */
  .m{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-style:italic;white-space:nowrap}
  .m sup,.m sub{font-size:.72em;line-height:0}
  .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;font-size:.95em;line-height:1.25}
  .fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .2em .05em}
  .fr>span:last-child{padding:.05em .2em 0}
  .lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-style:normal;line-height:1.05;margin-right:.2em}
  .lim small{font-size:.68em;font-style:italic}
  .pw{display:inline-flex;align-items:center;vertical-align:middle}
  .pw .br{font-size:2.3em;font-style:normal;font-weight:300;line-height:1;margin-right:.1em}
  .pw .rows{line-height:1.5;white-space:pre}
  .ov{border-top:1px solid currentColor;padding-left:.05em}
  body.beamer{font-size:20px} body.beamer main{max-width:1150px}
  @media (max-width:560px){ .m{white-space:normal} }
</style>

<script>
"use strict";
(function(){
  var DATA = {"bloecke": [{"nr": 1, "titel": "Ableitungsregeln"}, {"nr": 2, "titel": "Differenzenquotient und Differentialquotient"}, {"nr": 3, "titel": "Tangenten"}], "aufgaben": [{"nr": "1.1", "stufe": "g", "text": "<p>Bilde jeweils die erste Ableitung.</p><ol class=\"tl\"><li><span class=\"m\">f(x)=3x<sup>4</sup></span></li><li><span class=\"m\">f(x)=5x<sup>7</sup>−x</span></li><li><span class=\"m\">f(x)=−2x<sup>3</sup>+4x<sup>2</sup>−6x+1</span></li><li><span class=\"m\">f(x)=<span class=\"fr\"><span>2</span><span>3</span></span>x<sup>3</sup></span></li><li><span class=\"m\">f(x)=8</span></li><li><span class=\"m\">f(x)=x</span></li></ol>", "tipps": ["Potenzregel: <span class=\"m\">x<sup>n</sup></span> wird zu <span class=\"m\">n·x<sup>n−1</sup></span>. Ein Faktor vor der Potenz bleibt einfach stehen (Faktorregel).", "e) Ein konstanter Summand ändert die Steigung nicht. f) <span class=\"m\">x=x<sup>1</sup></span> – was liefert die Potenzregel?"], "loes": "<ol class=\"tl\"><li><span class=\"m\">f′(x)=12x<sup>3</sup></span></li><li><span class=\"m\">f′(x)=35x<sup>6</sup>−1</span></li><li><span class=\"m\">f′(x)=−6x<sup>2</sup>+8x−6</span></li><li><span class=\"m\">f′(x)=2x<sup>2</sup></span></li><li><span class=\"m\">f′(x)=0</span>  (der Graph ist eine waagerechte Gerade)</li><li><span class=\"m\">f′(x)=1·x<sup>0</sup>=1</span></li></ol>"}, {"nr": "1.2", "stufe": "g", "text": "<p>Negative Exponenten: Schreibe zuerst als Potenz von x und bilde dann die Ableitung.</p><ol class=\"tl\"><li><span class=\"m\">f(x)=x<sup>−3</sup></span></li><li><span class=\"m\">f(x)=−4x<sup>−1</sup></span></li><li><span class=\"m\">f(x)=<span class=\"fr\"><span>6</span><span>x<sup>2</sup></span></span></span></li><li><span class=\"m\">f(x)=<span class=\"fr\"><span>1</span><span>3x<sup>3</sup></span></span></span></li><li><span class=\"m\">f(x)=<span class=\"fr\"><span>x</span><span>2</span></span></span></li></ol>", "tipps": ["Die Potenzregel gilt auch für negative Exponenten. Achtung: <span class=\"m\">−3−1=−4</span>, nicht <span class=\"m\">−2</span>.", "c) <span class=\"m\"><span class=\"fr\"><span>6</span><span>x<sup>2</sup></span></span>=6x<sup>−2</sup></span>. d) <span class=\"m\"><span class=\"fr\"><span>1</span><span>3x<sup>3</sup></span></span>=<span class=\"fr\"><span>1</span><span>3</span></span>x<sup>−3</sup></span> – die 3 im Nenner wird zum Faktor <span class=\"m\"><span class=\"fr\"><span>1</span><span>3</span></span></span>. e) Das ist gar kein Bruch mit x im Nenner!"], "loes": "<ol class=\"tl\"><li><span class=\"m\">f′(x)=−3x<sup>−4</sup>=−<span class=\"fr\"><span>3</span><span>x<sup>4</sup></span></span></span></li><li><span class=\"m\">f′(x)=4x<sup>−2</sup>=<span class=\"fr\"><span>4</span><span>x<sup>2</sup></span></span></span></li><li><span class=\"m\">f(x)=6x<sup>−2</sup></span> ⇒ <span class=\"m\">f′(x)=−12x<sup>−3</sup>=−<span class=\"fr\"><span>12</span><span>x<sup>3</sup></span></span></span></li><li><span class=\"m\">f(x)=<span class=\"fr\"><span>1</span><span>3</span></span>x<sup>−3</sup></span> ⇒ <span class=\"m\">f′(x)=−x<sup>−4</sup>=−<span class=\"fr\"><span>1</span><span>x<sup>4</sup></span></span></span></li><li><span class=\"m\">f(x)=<span class=\"fr\"><span>1</span><span>2</span></span>x</span> ⇒ <span class=\"m\">f′(x)=<span class=\"fr\"><span>1</span><span>2</span></span></span></li></ol>"}, {"nr": "1.3", "stufe": "a", "text": "<p>Hier musst du erst umformen. Für Produkte und Quotienten haben wir noch keine Regel – also ausmultiplizieren bzw. jeden Summanden einzeln teilen.</p><ol class=\"tl\"><li><span class=\"m\">f(x)=x<sup>3</sup>(x−4)</span></li><li><span class=\"m\">f(x)=(2x−1)<sup>2</sup></span></li><li><span class=\"m\">f(x)=<span class=\"fr\"><span>x<sup>4</sup>+3x</span><span>x<sup>2</sup></span></span></span></li><li><span class=\"m\">f(x)=<span class=\"fr\"><span>3x<sup>5</sup>−x<sup>2</sup></span><span>x<sup>3</sup></span></span></span></li></ol>", "tipps": ["b) Binomische Formel: <span class=\"m\">(2x−1)<sup>2</sup>=4x<sup>2</sup>−4x+1</span>.", "c) <span class=\"m\"><span class=\"fr\"><span>x<sup>4</sup></span><span>x<sup>2</sup></span></span>+<span class=\"fr\"><span>3x</span><span>x<sup>2</sup></span></span>=x<sup>2</sup>+3x<sup>−1</sup></span>. Potenzgesetz: Beim Teilen werden die Exponenten subtrahiert."], "loes": "<ol class=\"tl\"><li><span class=\"m\">f(x)=x<sup>4</sup>−4x<sup>3</sup></span> ⇒ <span class=\"m\">f′(x)=4x<sup>3</sup>−12x<sup>2</sup></span></li><li><span class=\"m\">f(x)=4x<sup>2</sup>−4x+1</span> ⇒ <span class=\"m\">f′(x)=8x−4</span></li><li><span class=\"m\">f(x)=x<sup>2</sup>+3x<sup>−1</sup></span> ⇒ <span class=\"m\">f′(x)=2x−3x<sup>−2</sup>=2x−<span class=\"fr\"><span>3</span><span>x<sup>2</sup></span></span></span></li><li><span class=\"m\">f(x)=3x<sup>2</sup>−x<sup>−1</sup></span> ⇒ <span class=\"m\">f′(x)=6x+x<sup>−2</sup>=6x+<span class=\"fr\"><span>1</span><span>x<sup>2</sup></span></span></span></li></ol>"}, {"nr": "1.4", "stufe": "a", "text": "<p>Aufgepasst: Nach welcher Variablen wird abgeleitet? Alle anderen Buchstaben sind feste Zahlen.</p><ol class=\"tl\"><li><span class=\"m\">f(t)=t<sup>2</sup>+x<sup>3</sup></span></li><li><span class=\"m\">f(x)=t<sup>2</sup>+x<sup>3</sup></span></li><li><span class=\"m\">f(z)=z<sup>3</sup>·y<sup>2</sup>−y</span></li><li>Kreisfläche <span class=\"m\">A(r)=π·r<sup>2</sup></span></li><li>Zylindervolumen <span class=\"m\">V(h)=π·r<sup>2</sup>·h</span></li></ol>", "tipps": ["Die Variable in der Klammer verrät es: Bei <span class=\"m\">f(t)</span> wird nach t abgeleitet, x ist dann eine Konstante wie 5.", "c) <span class=\"m\">y<sup>2</sup></span> ist ein konstanter Faktor, <span class=\"m\">y</span> ein konstanter Summand. d) und e): π ist auch nur eine Zahl."], "loes": "<ol class=\"tl\"><li><span class=\"m\">f′(t)=2t</span>  (<span class=\"m\">x<sup>3</sup></span> ist konstant und fällt weg)</li><li><span class=\"m\">f′(x)=3x<sup>2</sup></span>  (jetzt fällt <span class=\"m\">t<sup>2</sup></span> weg)</li><li><span class=\"m\">f′(z)=3z<sup>2</sup>·y<sup>2</sup></span></li><li><span class=\"m\">A′(r)=2πr</span> – übrigens genau der Kreisumfang!</li><li><span class=\"m\">V′(h)=π·r<sup>2</sup></span> – die Grundfläche des Zylinders.</li></ol>"}, {"nr": "1.5", "stufe": "v", "text": "<p>Fehlersuche: Ein Schüler hat folgende Ableitungen gebildet. Finde jeweils den Fehler, erkläre ihn und gib die richtige Ableitung an.</p><ol class=\"tl\"><li><span class=\"m\">f(x)=<span class=\"fr\"><span>4</span><span>x<sup>2</sup></span></span></span>  ⇒  <span class=\"m\">f′(x)=<span class=\"fr\"><span>4</span><span>2x</span></span></span></li><li><span class=\"m\">f(x)=x<sup>2</sup>·x<sup>3</sup></span>  ⇒  <span class=\"m\">f′(x)=2x·3x<sup>2</sup>=6x<sup>3</sup></span></li><li><span class=\"m\">f(a)=a<sup>3</sup>+5x</span>  ⇒  <span class=\"m\">f′(a)=3a<sup>2</sup>+5</span></li><li><span class=\"m\">f(x)=7</span>  ⇒  <span class=\"m\">f′(x)=7</span></li></ol>", "tipps": ["Schreib jede Funktion zuerst in die Form, in der die Regeln gelten (Potenzen von x, Summen).", "b) Darf man ein Produkt „faktorweise“ ableiten? Fasse vorher zusammen: <span class=\"m\">x<sup>2</sup>·x<sup>3</sup>=x<sup>?</sup></span>."], "loes": "<ol class=\"tl\"><li>Der Nenner wurde einfach abgeleitet. Richtig: <span class=\"m\">f(x)=4x<sup>−2</sup></span> ⇒ <span class=\"m\">f′(x)=−8x<sup>−3</sup>=−<span class=\"fr\"><span>8</span><span>x<sup>3</sup></span></span></span></li><li>Ein Produkt darf man nicht faktorweise ableiten. Richtig: <span class=\"m\">f(x)=x<sup>5</sup></span> ⇒ <span class=\"m\">f′(x)=5x<sup>4</sup></span></li><li>Abgeleitet wird nach a, also ist <span class=\"m\">5x</span> eine Konstante und fällt weg: <span class=\"m\">f′(a)=3a<sup>2</sup></span></li><li>Eine Konstante hat die Ableitung 0, der Graph ist waagerecht: <span class=\"m\">f′(x)=0</span></li></ol>"}, {"nr": "1.6", "stufe": "v", "text": "<p>Rückwärts gedacht: Gib jeweils eine Funktion f an, die die angegebene Ableitung hat.</p><ol class=\"tl\"><li><span class=\"m\">f′(x)=6x<sup>2</sup>−2</span></li><li><span class=\"m\">f′(x)=−3x<sup>−4</sup></span></li><li>Wie viele solche Funktionen gibt es jeweils? Begründe.</li></ol>", "tipps": ["Welche Potenz von x muss man ableiten, damit <span class=\"m\">x<sup>2</sup></span> entsteht? Dann den Faktor so wählen, dass 6 herauskommt.", "c) Was passiert mit einem konstanten Summanden beim Ableiten?"], "loes": "<ol class=\"tl\"><li>z. B. <span class=\"m\">f(x)=2x<sup>3</sup>−2x</span>, denn <span class=\"m\">f′(x)=6x<sup>2</sup>−2</span></li><li>z. B. <span class=\"m\">f(x)=x<sup>−3</sup>=<span class=\"fr\"><span>1</span><span>x<sup>3</sup></span></span></span></li><li>Unendlich viele: Man kann jede Konstante addieren, z. B. <span class=\"m\">f(x)=2x<sup>3</sup>−2x+5</span>, weil sie beim Ableiten wegfällt.</li></ol>"}, {"nr": "2.1", "stufe": "g", "text": "<p>Gegeben ist <span class=\"m\">f(x)=x<sup>2</sup>−3x</span>. Berechne die mittlere Änderungsrate (den Differenzenquotienten) auf dem Intervall.</p><ol class=\"tl\"><li><span class=\"m\">[1;4]</span></li><li><span class=\"m\">[−2;0]</span></li></ol>", "tipps": ["Mittlere Änderungsrate auf <span class=\"m\">[a;b]</span>: <span class=\"m\"><span class=\"fr\"><span>f(b)−f(a)</span><span>b−a</span></span></span>.", "Berechne zuerst die beiden Funktionswerte. Vorsicht mit den Minuszeichen bei <span class=\"m\">f(−2)</span>."], "loes": "<ol class=\"tl\"><li><span class=\"m\">f(4)=4</span>, <span class=\"m\">f(1)=−2</span> ⇒ <span class=\"m\"><span class=\"fr\"><span>4−(−2)</span><span>4−1</span></span>=<span class=\"fr\"><span>6</span><span>3</span></span>=2</span></li><li><span class=\"m\">f(0)=0</span>, <span class=\"m\">f(−2)=4+6=10</span> ⇒ <span class=\"m\"><span class=\"fr\"><span>0−10</span><span>0−(−2)</span></span>=<span class=\"fr\"><span>−10</span><span>2</span></span>=−5</span></li></ol>"}, {"nr": "2.2", "stufe": "a", "text": "<p>Berechne die Ableitung an der Stelle <span class=\"m\">x<sub>0</sub></span> mithilfe des Differentialquotienten <span class=\"m\"><span class=\"lim\">lim<small>x→x<sub>0</sub></small></span><span class=\"fr\"><span>f(x)−f(x<sub>0</sub>)</span><span>x−x<sub>0</sub></span></span></span> und kontrolliere mit den Ableitungsregeln.</p><ol class=\"tl\"><li><span class=\"m\">f(x)=x<sup>2</sup>−2x</span>, <span class=\"m\">x<sub>0</sub>=3</span></li><li><span class=\"m\">f(x)=2x<sup>2</sup>+x</span>, <span class=\"m\">x<sub>0</sub>=−1</span></li></ol>", "tipps": ["Berechne <span class=\"m\">f(x<sub>0</sub>)</span> und stelle den Zähler auf. Setzt man <span class=\"m\">x<sub>0</sub></span> ein, wird der Zähler 0 – also ist <span class=\"m\">(x−x<sub>0</sub>)</span> ein Faktor.", "a) <span class=\"m\">x<sup>2</sup>−2x−3=(x−3)(x+1)</span>. b) Bestimme die Nullstellen von <span class=\"m\">2x<sup>2</sup>+x−1</span> mit der pq-Formel (vorher durch 2 teilen)."], "loes": "<ol class=\"tl\"><li><span class=\"m\">f(3)=3</span>: <span class=\"m\"><span class=\"fr\"><span>x<sup>2</sup>−2x−3</span><span>x−3</span></span>=<span class=\"fr\"><span>(x−3)(x+1)</span><span>x−3</span></span>=x+1</span> → <span class=\"m\">f′(3)=4</span>. Kontrolle: <span class=\"m\">f′(x)=2x−2</span>, <span class=\"m\">f′(3)=4</span> ✓</li><li><span class=\"m\">f(−1)=1</span>: <span class=\"m\"><span class=\"fr\"><span>2x<sup>2</sup>+x−1</span><span>x+1</span></span>=<span class=\"fr\"><span>(x+1)(2x−1)</span><span>x+1</span></span>=2x−1</span> → <span class=\"m\">f′(−1)=−3</span>. Kontrolle: <span class=\"m\">f′(x)=4x+1</span>, <span class=\"m\">f′(−1)=−3</span> ✓</li></ol>"}, {"nr": "2.3", "stufe": "a", "text": "<p>Ein Auto fährt an einer Ampel an. Der zurückgelegte Weg wird in den ersten 10 Sekunden beschrieben durch <span class=\"m\">s(t)=<span class=\"fr\"><span>3</span><span>2</span></span>t<sup>2</sup></span> (t in s, s(t) in m).</p><ol class=\"tl\"><li>Berechne die mittlere Geschwindigkeit in den ersten 4 Sekunden.</li><li>Berechne die momentane Geschwindigkeit zum Zeitpunkt <span class=\"m\">t=4</span> mithilfe des Differentialquotienten.</li><li>Zu welchem Zeitpunkt zeigt der Tacho 18 m/s (knapp 65 km/h) an?</li></ol>", "tipps": ["a) mittlere Geschwindigkeit = Differenzenquotient auf <span class=\"m\">[0;4]</span>. b) Klammere im Zähler <span class=\"m\"><span class=\"fr\"><span>3</span><span>2</span></span></span> aus und nutze die dritte binomische Formel.", "c) Die momentane Geschwindigkeit ist <span class=\"m\">s′(t)</span>. Löse <span class=\"m\">s′(t)=18</span>."], "loes": "<ol class=\"tl\"><li><span class=\"m\"><span class=\"fr\"><span>s(4)−s(0)</span><span>4</span></span>=<span class=\"fr\"><span>24</span><span>4</span></span>=6</span> m/s</li><li><span class=\"m\"><span class=\"fr\"><span><span class=\"fr\"><span>3</span><span>2</span></span>t<sup>2</sup>−24</span><span>t−4</span></span>=<span class=\"fr\"><span><span class=\"fr\"><span>3</span><span>2</span></span>(t−4)(t+4)</span><span>t−4</span></span>=<span class=\"fr\"><span>3</span><span>2</span></span>(t+4)</span> → für <span class=\"m\">t→4</span>: <span class=\"m\">12</span> m/s</li><li><span class=\"m\">s′(t)=3t=18</span> ⇒ <span class=\"m\">t=6</span> s</li></ol>"}, {"nr": "2.4", "stufe": "a", "text": "<p>Der Wasserstand eines Stausees wird durch W(t) beschrieben (t in Stunden ab Mitternacht, W(t) in cm). Erkläre in Worten, was die Angaben im Sachzusammenhang bedeuten.</p><ol class=\"tl\"><li><span class=\"m\">W(3)=120</span></li><li><span class=\"m\"><span class=\"fr\"><span>W(5)−W(3)</span><span>5−3</span></span>=−4</span></li><li><span class=\"m\">W′(5)=−6</span></li><li><span class=\"m\">W′(8)=0</span></li></ol>", "tipps": ["Funktionswert = Zustand (wie hoch?), Differenzenquotient = durchschnittliche Änderung in einem Zeitraum, Ableitung = Änderung in einem Moment.", "Achte auf die Einheiten: Eine Änderungsrate hat hier die Einheit cm pro Stunde. Das Vorzeichen sagt, ob der Wasserstand steigt oder sinkt."], "loes": "<ol class=\"tl\"><li>Um 3 Uhr beträgt der Wasserstand 120 cm.</li><li>Zwischen 3 und 5 Uhr sinkt der Wasserstand im Durchschnitt um 4 cm pro Stunde.</li><li>Um 5 Uhr sinkt der Wasserstand gerade mit 6 cm pro Stunde.</li><li>Um 8 Uhr ändert sich der Wasserstand in diesem Moment nicht (z. B. Umkehr von Sinken zu Steigen).</li></ol>"}, {"nr": "2.5", "stufe": "v", "text": "<p>Warum gilt die Potenzregel eigentlich? Wir begründen sie für einige Fälle mit dem Differentialquotienten.</p><ol class=\"tl\"><li>Zeige für <span class=\"m\">f(x)=x<sup>2</sup></span>: <span class=\"m\"><span class=\"lim\">lim<small>x→x<sub>0</sub></small></span><span class=\"fr\"><span>x<sup>2</sup>−x<sub>0</sub><sup>2</sup></span><span>x−x<sub>0</sub></span></span>=2x<sub>0</sub></span>.</li><li>Zeige für <span class=\"m\">g(x)=5x<sup>2</sup></span>, dass <span class=\"m\">g′(x<sub>0</sub>)=10x<sub>0</sub></span> ist. Welche Ableitungsregel wird hier sichtbar?</li><li>Für <span class=\"m\">h(x)=x<sup>3</sup></span> gilt <span class=\"m\">x<sup>3</sup>−x<sub>0</sub><sup>3</sup>=(x−x<sub>0</sub>)(x<sup>2</sup>+x·x<sub>0</sub>+x<sub>0</sub><sup>2</sup>)</span>. Prüfe das durch Ausmultiplizieren und bestimme damit <span class=\"m\">h′(x<sub>0</sub>)</span>.</li></ol>", "tipps": ["a) Dritte binomische Formel – nur diesmal mit <span class=\"m\">x<sub>0</sub></span> statt einer Zahl.", "b) Klammere im Zähler <span class=\"m\">5</span> aus. c) Nach dem Kürzen bleibt <span class=\"m\">x<sup>2</sup>+x·x<sub>0</sub>+x<sub>0</sub><sup>2</sup></span>. Was ergibt sich für <span class=\"m\">x→x<sub>0</sub></span>?"], "loes": "<ol class=\"tl\"><li><span class=\"m\"><span class=\"fr\"><span>(x−x<sub>0</sub>)(x+x<sub>0</sub>)</span><span>x−x<sub>0</sub></span></span>=x+x<sub>0</sub></span> → für <span class=\"m\">x→x<sub>0</sub></span>: <span class=\"m\">2x<sub>0</sub></span> ✓</li><li><span class=\"m\"><span class=\"fr\"><span>5x<sup>2</sup>−5x<sub>0</sub><sup>2</sup></span><span>x−x<sub>0</sub></span></span>=5·<span class=\"fr\"><span>x<sup>2</sup>−x<sub>0</sub><sup>2</sup></span><span>x−x<sub>0</sub></span></span></span> → <span class=\"m\">5·2x<sub>0</sub>=10x<sub>0</sub></span>. Das ist die Faktorregel: Der Faktor 5 bleibt einfach stehen.</li><li>Ausmultipliziert: <span class=\"m\">x<sup>3</sup>+x<sup>2</sup>x<sub>0</sub>+xx<sub>0</sub><sup>2</sup>−x<sup>2</sup>x<sub>0</sub>−xx<sub>0</sub><sup>2</sup>−x<sub>0</sub><sup>3</sup>=x<sup>3</sup>−x<sub>0</sub><sup>3</sup></span> ✓. Nach dem Kürzen: <span class=\"m\">x<sup>2</sup>+x·x<sub>0</sub>+x<sub>0</sub><sup>2</sup></span> → <span class=\"m\">x<sub>0</sub><sup>2</sup>+x<sub>0</sub><sup>2</sup>+x<sub>0</sub><sup>2</sup>=3x<sub>0</sub><sup>2</sup></span> – genau die Potenzregel!</li></ol>"}, {"nr": "3.1", "stufe": "g", "text": "<p>Bestimme jeweils die Gleichung der Tangente an den Graphen an der Stelle <span class=\"m\">x<sub>0</sub></span>.</p><ol class=\"tl\"><li><span class=\"m\">f(x)=x<sup>2</sup>+1</span>, <span class=\"m\">x<sub>0</sub>=2</span></li><li><span class=\"m\">f(x)=−x<sup>3</sup>+2x</span>, <span class=\"m\">x<sub>0</sub>=1</span></li></ol>", "tipps": ["Rezept: Punkt <span class=\"m\">(x<sub>0</sub> | f(x<sub>0</sub>))</span> berechnen, Steigung <span class=\"m\">m=f′(x<sub>0</sub>)</span> berechnen, beides in <span class=\"m\">y=mx+n</span> einsetzen und n bestimmen.", "a) Punkt (2 | 5), Steigung <span class=\"m\">f′(2)=4</span>. Also <span class=\"m\">5=4·2+n</span>."], "loes": "<ol class=\"tl\"><li><span class=\"m\">f(2)=5</span>, <span class=\"m\">f′(x)=2x</span>, <span class=\"m\">f′(2)=4</span>; <span class=\"m\">5=8+n</span> ⇒ <span class=\"m\">n=−3</span> ⇒ <span class=\"m\">t: y=4x−3</span></li><li><span class=\"m\">f(1)=1</span>, <span class=\"m\">f′(x)=−3x<sup>2</sup>+2</span>, <span class=\"m\">f′(1)=−1</span>; <span class=\"m\">1=−1+n</span> ⇒ <span class=\"m\">n=2</span> ⇒ <span class=\"m\">t: y=−x+2</span></li></ol>"}, {"nr": "3.2", "stufe": "a", "text": "<p>Besondere Tangenten:</p><ol class=\"tl\"><li>An welcher Stelle hat der Graph von <span class=\"m\">f(x)=x<sup>2</sup>−6x+5</span> eine waagerechte Tangente? Gib die Tangentengleichung an.</li><li>An welcher Stelle verläuft die Tangente an den Graphen von <span class=\"m\">g(x)=x<sup>2</sup>−3x+4</span> parallel zur Winkelhalbierenden <span class=\"m\">y=x</span>? Bestimme die Tangentengleichung. Was fällt dir auf?</li></ol>", "tipps": ["waagerecht bedeutet Steigung 0, parallel zu <span class=\"m\">y=x</span> bedeutet Steigung 1.", "Löse <span class=\"m\">f′(x)=0</span> bzw. <span class=\"m\">g′(x)=1</span> und berechne dann den Punkt."], "loes": "<ol class=\"tl\"><li><span class=\"m\">f′(x)=2x−6=0</span> ⇒ <span class=\"m\">x=3</span>; <span class=\"m\">f(3)=−4</span> ⇒ <span class=\"m\">t: y=−4</span></li><li><span class=\"m\">g′(x)=2x−3=1</span> ⇒ <span class=\"m\">x=2</span>; <span class=\"m\">g(2)=2</span> ⇒ <span class=\"m\">2=2+n</span> ⇒ <span class=\"m\">n=0</span> ⇒ <span class=\"m\">t: y=x</span>. Überraschung: Die Tangente ist die Winkelhalbierende selbst – sie berührt die Parabel im Punkt (2 | 2).</li></ol>"}, {"nr": "3.3", "stufe": "a", "text": "<p>Gegeben ist <span class=\"m\">f(x)=2x<sup>3</sup>+6x</span>.</p><ol class=\"tl\"><li>Bestimme <span class=\"m\">f′(x)</span> und begründe, dass der Graph an keiner Stelle die Steigung 5 hat.</li><li>Welche Steigung wird an genau einer Stelle angenommen? Begründe.</li><li>Was bedeutet das Ergebnis aus a) für den Verlauf des Graphen?</li></ol>", "tipps": ["<span class=\"m\">f′(x)=6x<sup>2</sup>+6</span>. Wie klein kann <span class=\"m\">6x<sup>2</sup></span> höchstens werden?", "Da <span class=\"m\">x<sup>2</sup>≥0</span> ist, gilt <span class=\"m\">f′(x)≥6</span>. Für welches x wird genau 6 erreicht?"], "loes": "<ol class=\"tl\"><li><span class=\"m\">f′(x)=6x<sup>2</sup>+6</span>; da <span class=\"m\">x<sup>2</sup>≥0</span>, gilt <span class=\"m\">f′(x)≥6&gt;5</span>. (Alternativ: <span class=\"m\">6x<sup>2</sup>+6=5</span> ⇒ <span class=\"m\">x<sup>2</sup>=−<span class=\"fr\"><span>1</span><span>6</span></span></span>, keine Lösung.)</li><li>Die Steigung 6 nur bei <span class=\"m\">x=0</span>; jede größere Steigung wird an zwei Stellen (<span class=\"m\">±x</span>) angenommen.</li><li>Die Steigung ist überall positiv – der Graph steigt also überall.</li></ol>"}, {"nr": "3.4", "stufe": "a", "text": "<p>Gegeben ist <span class=\"m\">f(x)=x<sup>2</sup>−2x</span>.</p><ol class=\"tl\"><li>Bestimme die Tangente an den Graphen an der Stelle <span class=\"m\">x<sub>0</sub>=3</span>.</li><li>Berechne die Schnittpunkte dieser Tangente mit den Koordinatenachsen.</li><li>Liegt der Punkt Q(5 | 11) auf der Tangente?</li></ol>", "tipps": ["b) Schnittpunkt mit der y-Achse: <span class=\"m\">x=0</span> einsetzen. Mit der x-Achse: <span class=\"m\">y=0</span> setzen und nach x auflösen.", "c) Setze <span class=\"m\">x=5</span> in die Tangentengleichung ein und vergleiche mit 11."], "loes": "<ol class=\"tl\"><li><span class=\"m\">f(3)=3</span>, <span class=\"m\">f′(x)=2x−2</span>, <span class=\"m\">f′(3)=4</span>; <span class=\"m\">3=12+n</span> ⇒ <span class=\"m\">n=−9</span> ⇒ <span class=\"m\">t: y=4x−9</span></li><li>y-Achse: (0 | −9); x-Achse: <span class=\"m\">4x−9=0</span> ⇒ <span class=\"m\">x=<span class=\"fr\"><span>9</span><span>4</span></span></span> ⇒ (2,25 | 0)</li><li><span class=\"m\">4·5−9=11</span> ✓ – Q liegt auf der Tangente (aber nicht auf der Parabel, denn <span class=\"m\">f(5)=15</span>).</li></ol>"}, {"nr": "3.5", "stufe": "v", "text": "<p>Gegeben sind <span class=\"m\">f(x)=x<sup>2</sup></span> und <span class=\"m\">g(x)=x<sup>3</sup></span>.</p><ol class=\"tl\"><li>An welchen Stellen haben die Tangenten an beide Graphen dieselbe Steigung?</li><li>Bestimme für die Stelle ungleich 0 beide Tangentengleichungen. Sind die Tangenten parallel oder identisch?</li><li>Was ist an der Stelle 0 besonders?</li></ol>", "tipps": ["a) Setze <span class=\"m\">f′(x)=g′(x)</span> und bringe alles auf eine Seite. Dann ausklammern und Satz vom Nullprodukt.", "b) Parallel bedeutet gleiche Steigung, aber verschiedene y-Achsenabschnitte n."], "loes": "<ol class=\"tl\"><li><span class=\"m\">2x=3x<sup>2</sup></span> ⇒ <span class=\"m\">x(3x−2)=0</span> ⇒ <span class=\"m\">x=0</span> oder <span class=\"m\">x=<span class=\"fr\"><span>2</span><span>3</span></span></span></li><li>Steigung jeweils <span class=\"m\"><span class=\"fr\"><span>4</span><span>3</span></span></span>. f: <span class=\"m\"><span class=\"fr\"><span>4</span><span>9</span></span>=<span class=\"fr\"><span>4</span><span>3</span></span>·<span class=\"fr\"><span>2</span><span>3</span></span>+n</span> ⇒ <span class=\"m\">y=<span class=\"fr\"><span>4</span><span>3</span></span>x−<span class=\"fr\"><span>4</span><span>9</span></span></span>; g: <span class=\"m\"><span class=\"fr\"><span>8</span><span>27</span></span>=<span class=\"fr\"><span>8</span><span>9</span></span>+n</span> ⇒ <span class=\"m\">y=<span class=\"fr\"><span>4</span><span>3</span></span>x−<span class=\"fr\"><span>16</span><span>27</span></span></span>. Verschiedene n ⇒ parallel, nicht identisch.</li><li>Bei 0 haben beide Graphen den Punkt (0 | 0) und die Steigung 0 – die Tangente ist bei beiden die x-Achse, also identisch.</li></ol>"}]};
  var STUFEN = {g:["Grundlage","b-g"], a:["Anwenden","b-a"], v:["Vertiefen","b-v"]};
  var root = document.getElementById("inhalt");
  var html = "";
  DATA.bloecke.forEach(function(bl){
    html += '<h2 id="block' + bl.nr + '"><span class="dot"></span>' + bl.nr + ' &nbsp;' + bl.titel + '</h2>';
    DATA.aufgaben.forEach(function(au){
      if(au.nr.split(".")[0] !== String(bl.nr)) return;
      var st = STUFEN[au.stufe];
      html += '<div class="aufgabe" data-stufe="' + au.stufe + '">' +
        '<div class="a-head"><span class="a-num">' + au.nr + '</span><span class="a-badge ' + st[1] + '">' + st[0] + '</span><span class="a-caret">&#9662;</span></div>' +
        '<div class="a-body">' + au.text;
      au.tipps.forEach(function(tp, i){
        html += '<details class="tipp"><summary>Tipp ' + (i + 1) + '</summary><div class="body">' + tp + '</div></details>';
      });
      html += '<details class="loes"><summary>Musterl&ouml;sung</summary><div class="body">' + au.loes + '</div></details></div></div>';
    });
  });
  root.innerHTML = html;

  document.querySelectorAll(".a-head").forEach(function(h){
    h.addEventListener("click", function(){ h.parentNode.classList.toggle("collapsed"); });
  });
  var cbtn = document.getElementById("collapseAll");
  cbtn.addEventListener("click", function(){
    var aufs = document.querySelectorAll(".aufgabe"), anyOpen = false;
    aufs.forEach(function(a){ if(!a.classList.contains("collapsed")) anyOpen = true; });
    aufs.forEach(function(a){ a.classList.toggle("collapsed", anyOpen); });
    cbtn.textContent = anyOpen ? "Alle ausklappen" : "Alle einklappen";
  });
  var fbtns = document.querySelectorAll(".fbtn");
  fbtns.forEach(function(b){
    b.addEventListener("click", function(){
      fbtns.forEach(function(x){ x.classList.remove("active"); });
      b.classList.add("active");
      var f = b.dataset.f;
      document.querySelectorAll(".aufgabe").forEach(function(a){
        a.classList.toggle("hidden", f !== "alle" && a.dataset.stufe !== f);
      });
      document.querySelectorAll("#inhalt h2").forEach(function(h){
        var vis = false, n = h.nextElementSibling;
        while(n && n.tagName !== "H2"){ if(!n.classList.contains("hidden")){ vis = true; break; } n = n.nextElementSibling; }
        h.style.display = vis ? "" : "none";
      });
    });
  });
  document.getElementById("beamer").addEventListener("click", function(){ document.body.classList.toggle("beamer"); });
})();
</script>
